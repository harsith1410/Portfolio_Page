<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .nav-item{ font-size: 18px; height: min-content; width: 100px; }
        html{ height: 80%; }
        body { background-color: #0f172a; color: #e2e8f0; height: 100%; }
        .navbar-custom { background-color: #1e293b; box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.3); }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link { color: #e2e8f0; }
        .navbar-custom .nav-link:hover, .navbar-custom .nav-link.active { color: #38bdf8; }
        .navbar-brand{ font-size: 25px; }
        .card{ box-shadow: 0 0 20px 2px rgba(56, 189, 248, 0.2); }
        .skills-section h2 { text-align: center; color: #e2e8f0; margin-bottom: 1.5rem; font-weight: 600; }
        .skills-grid { display: grid; grid-template-columns: repeat(4, auto); gap: 1.5rem; justify-content: center; }
        .leetcode-table { background-color: #1e293b; border: 1px solid #38bdf8; border-radius: 8px; overflow: hidden; }
        .leetcode-table th, .leetcode-table td { color: #e2e8f0; border-color: #334155; vertical-align: middle; }
        .leetcode-table thead th { background-color: #334155; color: #38bdf8; font-size: 1.2rem; }
        .progress { background-color: #334155; }
        #leetcode{ border: 1px solid #38bdf8; box-shadow: 0 0 20px 2px rgba(56, 189, 248, 0.3); }
    </style>
</head>
<body>
<div><br><br></div>
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/ironman112/home}">Portfolio</a>
        <div class="navbar-collapse justify-content-center" id="navbarNav">
            <ul class="navbar-nav mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/ironman112/home}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/about}">About</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/projects}">Projects</a></li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" th:href="@{/skills}">Skills</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container align-items-center mt-5">
    <div class="row mt-4" style="height: 80%">
        <div class="col-lg-7 d-flex flex-column justify-content-center">
            <div class="skills-section mb-5">
                <h2>Languages</h2>
                <div class="skills-grid">
                    <div class="card text-bg-dark border-info" style="width: 120px; height: 80px;">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <img src="/images/skills/java.svg" alt="Java" style="height: 30px; margin-bottom: 5px;"/>
                            <b>Java</b>
                        </div>
                    </div>
                    <div class="card text-bg-dark border-info" style="width: 120px; height: 80px;">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <img src="/images/skills/python.svg" alt="Python" style="height: 30px; margin-bottom: 5px;"/>
                            <b>Python</b>
                        </div>
                    </div>
                    <div class="card text-bg-dark border-info" style="width: 120px; height: 80px;">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <img src="/images/skills/c.svg" alt="C" style="height: 30px; margin-bottom: 5px;"/>
                            <b>C</b>
                        </div>
                    </div>
                </div>
            </div>

            <div class="skills-section mb-5">
                <h2>Frameworks</h2>
                <div class="skills-grid">
                    <div class="card text-bg-dark border-info" style="width: 120px; height: 80px;">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <img src="/images/skills/icons8-spring-boot-500.svg" alt="Springboot" style="height: 30px; margin-bottom: 5px;"/>
                            <b>Springboot</b>
                        </div>
                    </div>
                    <div class="card text-bg-dark border-info" style="width: 120px; height: 80px;">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <img src="/images/skills/django.svg" alt="Django" style="height: 30px; margin-bottom: 5px;"/>
                            <b>Django</b>
                        </div>
                    </div>
                    <div class="card text-bg-dark border-info" style="width: 120px; height: 80px;">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <img src="/images/skills/flask.svg" alt="Flask" style="height: 30px; margin-bottom: 5px; background-color: white"/>
                            <b>Flask</b>
                        </div>
                    </div>
                </div>
            </div>

            <div class="skills-section">
                <h2>Tools</h2>
                <div class="skills-grid">
                    <div class="card text-bg-dark border-info" style="width: 120px; height: 80px;">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <img src="/images/skills/github.svg" alt="Github" style="height: 30px; margin-bottom: 5px;background-color: #F05032"/>
                            <b>Github</b>
                        </div>
                    </div>
                    <div class="card text-bg-dark border-info" style="width: 120px; height: 80px;">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <img src="/images/skills/mysql%20(1).svg" alt="SQL" style="height: 30px; margin-bottom: 5px;"/>
                            <b>SQL</b>
                        </div>
                    </div>
                    <div class="card text-bg-dark border-info" style="width: 120px; height: 80px;">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <img src="/images/skills/html.svg" alt="HTML" style="height: 30px; margin-bottom: 5px;"/>
                            <b>HTML</b>
                        </div>
                    </div>
                    <div class="card text-bg-dark border-info" style="width: 120px; height: 80px;">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <img src="/images/skills/bootstrap.svg" alt="Bootstrap" style="height: 30px; margin-bottom: 5px;background-color: #7952B3"/>
                            <b>Bootstrap</b>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-5 d-flex flex-column justify-content-center">
            <div class="row" style="height: 80%" id="leetcode">
                <div class="text-center" style="margin-top: 5px">
                    <h2 class="mb-4"><span style="color: #FFA116">LeetCode</span> Stats</h2>
                    <table class="table table-dark leetcode-table">
                        <thead>
                        <tr>
                            <th scope="col" class="text-center">Profile: harsith1410</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td>
                                <div class="d-flex justify-content-between">
                                    <span><strong>Global Ranking</strong></span>
                                    <span>506,433</span>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="d-flex justify-content-between">
                                    <span><strong>Total Solved</strong></span>
                                    <span style="font-weight: bold; color: #38bdf8;">272 / 3873</span>
                                </div>
                                <div class="progress mt-1" role="progressbar">
                                    <div class="progress-bar" style="width: 8%;"></div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="d-flex justify-content-between">
                                    <span>Easy</span>
                                    <span>129 / 932</span>
                                </div>
                                <div class="progress mt-1" role="progressbar">
                                    <div class="progress-bar bg-success" style="width: 14%;"></div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="d-flex justify-content-between">
                                    <span>Medium</span>
                                    <span>137 / 2026</span>
                                </div>
                                <div class="progress mt-1" role="progressbar">
                                    <div class="progress-bar bg-warning" style="width: 7%;"></div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="d-flex justify-content-between">
                                    <span>Hard</span>
                                    <span>6 / 915</span>
                                </div>
                                <div class="progress mt-1" role="progressbar">
                                    <div class="progress-bar bg-danger" style="width: 3%;"></div>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="row mt-5" style="height: 30%"></div>
        </div>
    </div>
</div>
</body>
</html>
