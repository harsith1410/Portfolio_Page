<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous" />
    <style>

        html{
            height: 80%;
        }

        body {
            background-color: #0f172a;
            color: #e2e8f0;
            height: 100%;
        }

        .navbar-custom {
            background-color: #1e293b;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.3);
        }

        .navbar-custom .navbar-brand,
        .navbar-custom .nav-link {
            color: #e2e8f0;
        }

        .navbar-custom .nav-link:hover,
        .navbar-custom .nav-link.active {
            color: #38bdf8;
        }
        .navbar-brand{
            font-size: 25px;
        }
        .nav-item{
            font-size: 18px;
            height: min-content;
            width: 100px;
        }
        .container{
            height: 80%;
        }

        .col{
            height: 100%;
        }

        .img-thumbnail{
            vertical-align: bottom;
            border-color: #1e293b;
        }

        .rounded{
            background-color: #1e293b;
            color: #1e293b;
            box-shadow: 0 0 20px 2px rgba(56, 189, 248, 0.1);
        }
    </style>
</head>
<body>
    <div>
        <br><br>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/ironman112/home}">Portfolio</a>
            <div class="navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" th:href="@{/ironman112/home}" methods="GET">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/about}">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/projects}">Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/skills}">Skills</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container align-items-center mt-5">
        <div class="row mt-4" style="height: 80%">

            <div class="col-lg-5 d-flex justify-content-center align-items-center mt-4 mt-lg-0">
                    <img th:src="@{/images/test_img.jpg}"
                         class="img-thumbnail rounded"
                         style="scale: 75%"
                         alt="Just a pic"/>

            </div>

            <div class="col">
                <div class="row" style="height: 50%">
                    <div class="align-self-bottom">
                        Hi I'm Harsith
                        Student at Shiv Nadar University
                    </div>
                </div>
                <div class="row" style="height: 50%">
                    <p>Passionate about Web development and Competitive Programming</p>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
